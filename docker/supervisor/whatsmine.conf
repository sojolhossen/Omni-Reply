; ─────────────────────────────────────────────────────────────────────────────
; Supervisor configuration for Omni agent queue workers.
;
; One program per named queue, each with its own concurrency.
; Place this file in /etc/supervisor/conf.d/omni_agent.conf and run:
;   supervisorctl reread && supervisorctl update
; ─────────────────────────────────────────────────────────────────────────────

[program:omni_agent-queue-default]
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omni_agent-default.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:omni_agent-queue-whatsapp]
command=php /var/www/html/artisan queue:work redis --queue=whatsapp --sleep=2 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=3
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omni_agent-whatsapp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:omni_agent-queue-broadcast]
command=php /var/www/html/artisan queue:work redis --queue=broadcast --sleep=3 --tries=2 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omni_agent-broadcast.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:omni_agent-queue-ai]
command=php /var/www/html/artisan queue:work redis --queue=ai --sleep=3 --tries=3 --max-time=600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omni_agent-ai.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:omni_agent-queue-social]
command=php /var/www/html/artisan queue:work redis --queue=social --sleep=5 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omni_agent-social.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:omni_agent-queue-leads]
command=php /var/www/html/artisan queue:work redis --queue=leads --sleep=5 --tries=2 --max-time=1800
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=1
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omni_agent-leads.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:omni_agent-queue-automation]
command=php /var/www/html/artisan queue:work redis --queue=automation --sleep=3 --tries=3 --max-time=1800
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/omni_agent-automation.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[group:omni_agent-queues]
programs=omni_agent-queue-default,omni_agent-queue-whatsapp,omni_agent-queue-broadcast,omni_agent-queue-ai,omni_agent-queue-social,omni_agent-queue-leads,omni_agent-queue-automation
